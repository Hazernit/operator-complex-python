name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ['3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libx11-xcb1
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run full test suite (zero skipped)
        run: python scripts/ci_test_runner.py
      - name: GUI smoke test (headless)
        run: python main.py --smoke-test
      - name: Verify launcher build is reproducible
        run: |
          python scripts/build_project_launcher.py
          git diff --exit-code -- run-python-project.bat
      - name: Validate Windows PowerShell source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $source = Get-Content -LiteralPath scripts/windows_project_launcher.ps1 -Raw
          [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parser reported errors.' }
          $bat = Get-Content -LiteralPath run-windows.bat -Raw
          if ($bat -notmatch '(?m)^# OPERATOR_POWERSHELL\r?$') { throw 'Project Windows BAT marker missing.' }
          $universal = Get-Content -LiteralPath run-python-project.bat -Raw
          if ($universal -notmatch '(?m)^# PYPROJECT_POWERSHELL\r?$' -or $universal -notmatch '(?m)^# PYPROJECT_PYTHON\r?$') {
            throw 'Universal BAT markers missing.'
          }