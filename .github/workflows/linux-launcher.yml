name: Linux source launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  launcher:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / source launcher
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        working-directory: operator complex source
    steps:
      - name: Check out into a path containing spaces
        uses: actions/checkout@v5
        with:
          path: operator complex source
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime and headless display servers
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb xauth weston libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libx11-xcb1
      - name: Check POSIX shell syntax and diagnostics tests
        run: |
          sh -n run-linux.sh
          shellcheck --shell=sh run-linux.sh
          python scripts/test_linux_shell.py
      - name: Fresh bootstrap, offline reuse, arbitrary cwd and real offscreen UI
        run: python scripts/linux_launcher_integration.py
      - name: Full PySide6 test suite (zero skipped)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python scripts/ci_test_runner.py
      - name: Real X11 UI smoke under Xvfb
        env:
          QT_QPA_PLATFORM: xcb
          PIP_NO_INDEX: '1'
        run: timeout 60s xvfb-run -a sh run-linux.sh --smoke-test
      - name: Real Wayland UI smoke under headless Weston
        env:
          QT_QPA_PLATFORM: wayland
          PIP_NO_INDEX: '1'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=operator-ci
          unset DISPLAY
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --width=1280 --height=720 --no-config > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor_pid=$!
          trap 'kill "$compositor_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            if ! kill -0 "$compositor_pid" 2>/dev/null; then cat "$RUNNER_TEMP/weston.log"; exit 1; fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then cat "$RUNNER_TEMP/weston.log"; exit 1; fi
          timeout 60s sh run-linux.sh --smoke-test
      - name: Upload compositor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launcher-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
